---
- name: Aruba AOS-CX | Capacity review
  hosts: aruba
  gather_facts: false
  serial: 5
  vars:
    workflow_id: capacity_review
    workflow_platform: aruba-aos-cx
    workflow_queries:
    - show capacities
    - show capacities-status
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
