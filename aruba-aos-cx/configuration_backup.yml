---
- name: Aruba AOS-CX | Configuration backup
  hosts: aruba
  gather_facts: false
  serial: 5
  vars:
    workflow_id: configuration_backup
    workflow_platform: aruba-aos-cx
    workflow_queries:
    - show running-config
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
