---
- name: Check Point Management API | Service dependency snapshot
  hosts: checkpoint
  gather_facts: false
  serial: 5
  vars:
    workflow_id: service_dependency_snapshot
    workflow_platform: check-point-gaia
    workflow_queries:
    - service_tcp
    - service_udp
    - service_icmp
    - service_group
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
