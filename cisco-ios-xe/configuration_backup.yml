---
- name: Cisco IOS XE | Configuration backup
  hosts: ios_xe
  gather_facts: false
  serial: 5
  vars:
    workflow_id: configuration_backup
    workflow_platform: cisco-ios-xe
    workflow_queries:
    - show running-config
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
