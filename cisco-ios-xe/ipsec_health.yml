---
- name: Cisco IOS XE | Ipsec health
  hosts: ios_xe
  gather_facts: false
  serial: 5
  vars:
    workflow_id: ipsec_health
    workflow_platform: cisco-ios-xe
    workflow_queries:
    - show crypto ikev2 sa
    - show crypto ipsec sa
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
