---
- name: Cisco IOS XE | License review
  hosts: ios_xe
  gather_facts: false
  serial: 5
  vars:
    workflow_id: license_review
    workflow_platform: cisco-ios-xe
    workflow_queries:
    - show license summary
    - show license status
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
