---
- name: Cisco IOS XE | Qfp datapath triage
  hosts: ios_xe
  gather_facts: false
  serial: 5
  vars:
    workflow_id: qfp_datapath_triage
    workflow_platform: cisco-ios-xe
    workflow_queries:
    - show platform hardware qfp active datapath utilization
    - show platform hardware qfp active statistics drop
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
