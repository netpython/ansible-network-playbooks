---
- name: Cisco IOS XE | Software install state
  hosts: ios_xe
  gather_facts: false
  serial: 5
  vars:
    workflow_id: software_install_state
    workflow_platform: cisco-ios-xe
    workflow_queries:
    - show install summary
    - show boot
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
