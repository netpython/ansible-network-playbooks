---
- name: Cisco IOS XE | Stackwise health
  hosts: ios_xe
  gather_facts: false
  serial: 5
  vars:
    workflow_id: stackwise_health
    workflow_platform: cisco-ios-xe
    workflow_queries:
    - show switch
    - show switch stack-ports summary
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
