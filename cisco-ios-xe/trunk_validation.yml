---
- name: Cisco IOS XE | Trunk validation
  hosts: ios_xe
  gather_facts: false
  serial: 5
  vars:
    workflow_id: trunk_validation
    workflow_platform: cisco-ios-xe
    workflow_queries:
    - show interfaces trunk
    - show etherchannel summary
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
