---
- name: Cisco IOS XE | Vrf inventory
  hosts: ios_xe
  gather_facts: false
  serial: 5
  vars:
    workflow_id: vrf_inventory
    workflow_platform: cisco-ios-xe
    workflow_queries:
    - show vrf
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
