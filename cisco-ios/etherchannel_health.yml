---
- name: Cisco IOS | Etherchannel health
  hosts: ios
  gather_facts: false
  serial: 5
  vars:
    workflow_id: etherchannel_health
    workflow_platform: cisco-ios
    workflow_queries:
    - show etherchannel summary
    - show lacp neighbor
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
