---
- name: Cisco IOS | Interface health
  hosts: ios
  gather_facts: false
  serial: 5
  vars:
    workflow_id: interface_health
    workflow_platform: cisco-ios
    workflow_queries:
    - show ip interface brief
    - show interfaces
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
