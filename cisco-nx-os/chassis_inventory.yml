---
- name: Cisco NX-OS | Chassis inventory
  hosts: nx_os
  gather_facts: false
  serial: 5
  vars:
    workflow_id: chassis_inventory
    workflow_platform: cisco-nx-os
    workflow_queries:
    - show version
    - show inventory
    - show module
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
