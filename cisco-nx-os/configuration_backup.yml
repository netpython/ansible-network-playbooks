---
- name: Cisco NX-OS | Configuration backup
  hosts: nx_os
  gather_facts: false
  serial: 5
  vars:
    workflow_id: configuration_backup
    workflow_platform: cisco-nx-os
    workflow_queries:
    - show running-config
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
