---
- name: Cisco NX-OS | Interface error triage
  hosts: nx_os
  gather_facts: false
  serial: 5
  vars:
    workflow_id: interface_error_triage
    workflow_platform: cisco-nx-os
    workflow_queries:
    - show interface brief
    - show interface counters errors
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
