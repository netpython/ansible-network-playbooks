---
- name: Cisco NX-OS | Spanning tree health
  hosts: nx_os
  gather_facts: false
  serial: 5
  vars:
    workflow_id: spanning_tree_health
    workflow_platform: cisco-nx-os
    workflow_queries:
    - show spanning-tree summary
    - show spanning-tree inconsistentports
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
