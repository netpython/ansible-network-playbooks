---
- name: Cisco NX-OS | System health
  hosts: nx_os
  gather_facts: false
  serial: 5
  vars:
    workflow_id: system_health
    workflow_platform: cisco-nx-os
    workflow_queries:
    - show system resources
    - show environment
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
