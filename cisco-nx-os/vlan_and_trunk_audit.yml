---
- name: Cisco NX-OS | Vlan and trunk audit
  hosts: nx_os
  gather_facts: false
  serial: 5
  vars:
    workflow_id: vlan_and_trunk_audit
    workflow_platform: cisco-nx-os
    workflow_queries:
    - show vlan brief
    - show interface trunk
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
