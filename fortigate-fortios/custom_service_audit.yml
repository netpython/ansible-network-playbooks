---
- name: FortiGate / FortiOS | Custom service audit
  hosts: fortios
  gather_facts: false
  serial: 5
  vars:
    workflow_id: custom_service_audit
    workflow_platform: fortigate-fortios
    workflow_queries:
    - firewall.service_custom
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
