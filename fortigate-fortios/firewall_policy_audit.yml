---
- name: FortiGate / FortiOS | Firewall policy audit
  hosts: fortios
  gather_facts: false
  serial: 5
  vars:
    workflow_id: firewall_policy_audit
    workflow_platform: fortigate-fortios
    workflow_queries:
    - firewall_policy
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
