---
- name: FortiGate / FortiOS | Policy dependency snapshot
  hosts: fortios
  gather_facts: false
  serial: 5
  vars:
    workflow_id: policy_dependency_snapshot
    workflow_platform: fortigate-fortios
    workflow_queries:
    - firewall_policy
    - firewall_address
    - firewall_addrgrp
    - firewall.service_custom
    - firewall.service_group
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
