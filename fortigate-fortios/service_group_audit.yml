---
- name: FortiGate / FortiOS | Service group audit
  hosts: fortios
  gather_facts: false
  serial: 5
  vars:
    workflow_id: service_group_audit
    workflow_platform: fortigate-fortios
    workflow_queries:
    - firewall.service_group
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
