---
all:
  children:
    ios:
      hosts:
        ios-lab:
          ansible_host: 192.0.2.11
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
    ios_xe:
      hosts:
        ios_xe-lab:
          ansible_host: 192.0.2.12
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.ios.ios
    nx_os:
      hosts:
        nx_os-lab:
          ansible_host: 192.0.2.13
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: cisco.nxos.nxos
    junos:
      hosts:
        junos-lab:
          ansible_host: 192.0.2.14
      vars:
        ansible_connection: ansible.netcommon.netconf
        ansible_network_os: junipernetworks.junos.junos
    aruba:
      hosts:
        aruba-lab:
          ansible_host: 192.0.2.15
      vars:
        ansible_connection: ansible.netcommon.network_cli
        ansible_network_os: arubanetworks.aoscx.aoscx
    panos:
      hosts:
        panos-lab:
          ansible_host: 192.0.2.16
      vars:
        ansible_connection: local
        ansible_python_interpreter: '{{ ansible_playbook_python }}'
    fortios:
      hosts:
        fortios-lab:
          ansible_host: 192.0.2.17
      vars:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: fortinet.fortios.fortios
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: true
        ansible_httpapi_port: 443
    checkpoint:
      hosts:
        checkpoint-lab:
          ansible_host: 192.0.2.18
      vars:
        ansible_connection: ansible.netcommon.httpapi
        ansible_network_os: check_point.mgmt.checkpoint
        ansible_httpapi_use_ssl: true
        ansible_httpapi_validate_certs: true
        ansible_httpapi_port: 443
        ansible_user: '{{ lookup(''ansible.builtin.env'', ''CHECKPOINT_USERNAME'', default=undef()) }}'
        ansible_password: '{{ lookup(''ansible.builtin.env'', ''CHECKPOINT_PASSWORD'', default=undef()) }}'
