---
- name: Palo Alto PAN-OS | Classic route review
  hosts: panos
  gather_facts: false
  serial: 5
  vars:
    workflow_id: classic_route_review
    workflow_platform: palo-alto-pan-os
    workflow_queries:
    - show routing route
    - show routing fib
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
