---
- name: Palo Alto PAN-OS | Ipsec health
  hosts: panos
  gather_facts: false
  serial: 5
  vars:
    workflow_id: ipsec_health
    workflow_platform: palo-alto-pan-os
    workflow_queries:
    - show vpn ike-sa
    - show vpn ipsec-sa
  tasks:
  - name: Collect and save evidence
    ansible.builtin.import_tasks: ../tasks/collect.yml
