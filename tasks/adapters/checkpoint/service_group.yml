---
- name: Read Check Point service group objects
  check_point.mgmt.cp_mgmt_service_group_facts:
    details_level: standard
    limit: '{{ checkpoint_limit | default(50) | int }}'
    offset: '{{ checkpoint_offset | default(0) | int }}'
  register: vendor_result
  changed_when: false
  ignore_unreachable: true
  no_log: true
